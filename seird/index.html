<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SEIRD Simulation</title>
        <link
            href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css"
            rel="stylesheet"
            type="text/css"
        />
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
        <style>
            @media (max-width: 720px) {
                #simulationCanvas,
                #chartCanvas {
                    width: 100% !important;
                    height: auto !important;
                }
            }
        </style>
    </head>
    <body class="font-sans">
        <div class="max-w-screen-lg mx-auto p-8">
            <div class="mb-8">
                <a class="font-bold text-2xl">SEIRD Simulation</a>
            </div>

            <div class="flex flex-col sm:flex-row justify-center gap-8 mb-8">
                <canvas
                    id="simulationCanvas"
                    class="border-2 border-gray-300 rounded-lg shadow-md"
                    width="470"
                    height="470"
                ></canvas>
                <canvas
                    id="chartCanvas"
                    class="border-2 border-gray-300 rounded-lg shadow-md"
                    width="475"
                    height="475"
                ></canvas>
            </div>
            <div id="controls" class="flex justify-center gap-4 mb-8">
                <button
                    id="startBtn"
                    class="btn btn-outline btn-neutral py-2 px-4 hover:scale-110 text-lg w-24"
                >
                    Start
                </button>
                <button
                    id="resetBtn"
                    class="btn btn-outline btn-neutral py-2 px-4 hover:scale-110 text-lg w-24"
                >
                    Reset
                </button>
                <button
                    id="downloadBtn"
                    class="btn btn-outline btn-neutral py-2 px-4 hover:scale-110 text-lg w-48"
                >
                    Download CSV
                </button>
            </div>
            <div id="stats" class="text-lg font-bold text-center mb-8"></div>
            <div id="parameters" class="grid grid-cols-1 sm:grid-cols-2 gap-8">
                <div class="flex flex-col">
                    <label class="font-medium text-base"
                        >Population Size:</label
                    >
                    <input
                        type="number"
                        id="populationSize"
                        min="50"
                        max="500"
                        step="10"
                        class="input input-bordered"
                        value="200"
                    />
                </div>
                <div class="flex flex-col">
                    <label class="font-medium text-base"
                        >Initial Infected:</label
                    >
                    <input
                        type="number"
                        id="initialInfected"
                        min="1"
                        max="100"
                        class="input input-bordered"
                        value="20"
                    />
                </div>
                <div class="flex flex-col">
                    <label class="font-medium text-base"
                        >Transmission Rate (%):</label
                    >
                    <input
                        type="number"
                        id="transmissionRate"
                        min="0"
                        max="100"
                        class="input input-bordered"
                        value="40"
                    />
                </div>
                <div class="flex flex-col">
                    <label class="font-medium text-base"
                        >Incubation Period (days):</label
                    >
                    <input
                        type="number"
                        id="incubationPeriod"
                        min="1"
                        max="30"
                        class="input input-bordered"
                        value="14"
                    />
                </div>
                <div class="flex flex-col">
                    <label class="font-medium text-base"
                        >Infectious Period (days):</label
                    >
                    <input
                        type="number"
                        id="infectiousPeriod"
                        min="1"
                        max="60"
                        class="input input-bordered"
                        value="14"
                    />
                </div>
                <div class="flex flex-col">
                    <label class="font-medium text-base"
                        >Recovery Rate (%):</label
                    >
                    <input
                        type="number"
                        id="recoveryRate"
                        min="0"
                        max="100"
                        class="input input-bordered"
                        value="100"
                    />
                </div>
                <div class="flex flex-col">
                    <label class="font-medium text-base">Movement Range:</label>
                    <input
                        type="number"
                        id="movementRange"
                        min="1"
                        max="10"
                        class="input input-bordered"
                        value="10"
                    />
                </div>
                <div class="flex flex-col">
                    <label class="font-medium text-base"
                        >Simulation Speed (ms):</label
                    >
                    <input
                        type="number"
                        id="simulationSpeed"
                        min="100"
                        max="1000"
                        step="100"
                        class="input input-bordered"
                        value="500"
                    />
                </div>
                <div class="flex items-center gap-2">
                    <label class="font-medium"
                        >Restrict Movement of Infectious:</label
                    >
                    <input
                        type="checkbox"
                        id="restrictMovement"
                        class="toggle"
                    />
                </div>
            </div>
        </div>

        <script>
            const canvas = document.getElementById("simulationCanvas");
            const ctx = canvas.getContext("2d");
            const chartCanvas = document.getElementById("chartCanvas");
            const chartCtx = chartCanvas.getContext("2d");
            const startBtn = document.getElementById("startBtn");
            const resetBtn = document.getElementById("resetBtn");
            const statsDiv = document.getElementById("stats");
            const restrictMovementToggle =
                document.getElementById("restrictMovement");

            let agents = [];
            let chart;
            let isRunning = false;
            let dayCounter = 0;
            let deathCount = 0;

            const ageGroups = [
                { min: 0, max: 17, multiplier: 0.2, label: "Young" },
                { min: 18, max: 64, multiplier: 1, label: "Adult" },
                { min: 65, max: 100, multiplier: 4, label: "Senior" },
            ];

            const parameters = [
                "populationSize",
                "initialInfected",
                "transmissionRate",
                "incubationPeriod",
                "infectiousPeriod",
                "recoveryRate",
                "movementRange",
                "simulationSpeed",
            ];

            parameters.forEach((id) => {
                document
                    .getElementById(id)
                    .addEventListener("input", updateSimulationParameters);
            });

            function updateSimulationParameters() {
                initializeAgents();
                drawSimulation();
                updateStats();
            }

            class Agent {
                constructor(x, y, state) {
                    this.x = x;
                    this.y = y;
                    this.state = state;
                    this.daysInState = 0;
                    this.age = Math.floor(Math.random() * 100);
                    this.ageGroup = ageGroups.find(
                        (g) => this.age >= g.min && this.age <= g.max,
                    );
                    this.targetX = Math.random() * canvas.width;
                    this.targetY = Math.random() * canvas.height;
                }

                move(range) {
                    if (this.state === 2 && restrictMovementToggle.checked)
                        return;
                    if (this.state === 4) return;

                    let dx = this.targetX - this.x;
                    let dy = this.targetY - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 5) {
                        this.targetX = Math.random() * canvas.width;
                        this.targetY = Math.random() * canvas.height;
                    } else {
                        let step = range;
                        this.x += (dx / distance) * step;
                        this.y += (dy / distance) * step;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = ["blue", "yellow", "red", "green", "black"][
                        this.state
                    ];
                    ctx.fill();
                }
            }

            function initializeAgents() {
                const populationSize = parseInt(
                    document.getElementById("populationSize").value,
                );
                const initialInfected = parseInt(
                    document.getElementById("initialInfected").value,
                );
                agents = Array.from({ length: populationSize }, (_, i) => {
                    const x = Math.random() * canvas.width;
                    const y = Math.random() * canvas.height;
                    const state = i < initialInfected ? 2 : 0;
                    return new Agent(x, y, state);
                });
            }

            function updateSimulation() {
                const transmissionRate =
                    parseFloat(
                        document.getElementById("transmissionRate").value,
                    ) / 100;
                const incubationPeriod = parseInt(
                    document.getElementById("incubationPeriod").value,
                );
                const infectiousPeriod = parseInt(
                    document.getElementById("infectiousPeriod").value,
                );
                const recoveryRate =
                    parseFloat(document.getElementById("recoveryRate").value) /
                    100;
                const movementRange = parseFloat(
                    document.getElementById("movementRange").value,
                );

                agents.forEach((agent) => {
                    agent.move(movementRange);
                    agent.daysInState++;
                    if (
                        agent.state === 1 &&
                        agent.daysInState >= incubationPeriod
                    ) {
                        agent.state = 2;
                        agent.daysInState = 0;
                    } else if (
                        agent.state === 2 &&
                        agent.daysInState >= infectiousPeriod
                    ) {
                        const deathProbability =
                            (1 - recoveryRate) * agent.ageGroup.multiplier;
                        agent.state = Math.random() < deathProbability ? 4 : 3;
                        if (agent.state === 4) {
                            deathCount++;
                        }
                        agent.daysInState = 0;
                    }
                });

                agents.forEach((susceptible) => {
                    if (susceptible.state === 0) {
                        let totalRisk = 1;
                        agents.forEach((infectious) => {
                            if (infectious.state === 2) {
                                const dx = infectious.x - susceptible.x;
                                const dy = infectious.y - susceptible.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                if (distance < 12) {
                                    const proximityFactor = 1 / (distance + 1);
                                    const p_i =
                                        transmissionRate * proximityFactor;
                                    totalRisk *= 1 - p_i;
                                }
                            }
                        });
                        const infectionProbability = 1 - totalRisk;
                        if (Math.random() < infectionProbability) {
                            susceptible.state = 1;
                            susceptible.daysInState = 0;
                        }
                    }
                });

                dayCounter++;
            }

            function drawSimulation() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                agents.forEach((agent) => agent.draw());
            }

            let csvData = [
                [
                    "day",
                    "susceptible",
                    "exposed",
                    "infectious",
                    "recovered",
                    "deaths",
                ],
            ];

            function captureData(counts) {
                csvData.push([
                    dayCounter,
                    counts[0],
                    counts[1],
                    counts[2],
                    counts[3],
                    counts[4],
                ]);
            }

            function downloadCSV() {
                let csvContent =
                    "data:text/csv;charset=utf-8," +
                    csvData.map((e) => e.join(",")).join("\n");

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "seir_simulation_data.csv");
                document.body.appendChild(link);

                link.click();
                document.body.removeChild(link);
            }

            document
                .getElementById("downloadBtn")
                .addEventListener("click", downloadCSV);

            function updateStats() {
                const counts = agents.reduce(
                    (acc, agent) => {
                        acc[agent.state]++;
                        return acc;
                    },
                    [0, 0, 0, 0, 0],
                );

                statsDiv.innerHTML = `
                Day: ${dayCounter}, Susceptible: ${counts[0]}, Exposed: ${counts[1]}, Infectious: ${counts[2]}, Recovered: ${counts[3]}, Deaths: ${deathCount}`;
                updateChart(counts);
                captureData(counts);
            }

            function updateChart(counts) {
                if (!chart) {
                    chart = new Chart(chartCtx, {
                        type: "line",
                        data: {
                            labels: [],
                            datasets: [
                                {
                                    label: "Susceptible",
                                    data: [],
                                    borderColor: "blue",
                                    fill: false,
                                },
                                {
                                    label: "Exposed",
                                    data: [],
                                    borderColor: "yellow",
                                    fill: false,
                                },
                                {
                                    label: "Infectious",
                                    data: [],
                                    borderColor: "red",
                                    fill: false,
                                },
                                {
                                    label: "Recovered",
                                    data: [],
                                    borderColor: "green",
                                    fill: false,
                                },
                                {
                                    label: "Deaths",
                                    data: [],
                                    borderColor: "black",
                                    fill: false,
                                },
                            ],
                        },
                        options: {
                            responsive: false,
                            scales: {
                                x: {
                                    type: "linear",
                                    position: "bottom",
                                    title: { display: true, text: "Days" },
                                },
                                y: {
                                    beginAtZero: true,
                                    title: {
                                        display: true,
                                        text: "Population",
                                    },
                                },
                            },
                        },
                    });
                }

                chart.data.labels.push(dayCounter);
                chart.data.datasets.forEach((dataset, i) => {
                    dataset.data.push(counts[i]);
                });
                chart.update();
            }

            function runSimulation() {
                if (isRunning) {
                    updateSimulation();
                    drawSimulation();
                    updateStats();
                    setTimeout(
                        runSimulation,
                        parseInt(
                            document.getElementById("simulationSpeed").value,
                        ),
                    );
                }
            }

            function resetSimulation() {
                isRunning = false;
                startBtn.textContent = "Start";
                dayCounter = 0;
                deathCount = 0;
                csvData = [
                    [
                        "day",
                        "susceptible",
                        "exposed",
                        "infectious",
                        "recovered",
                        "deaths",
                    ],
                ];

                initializeAgents();
                drawSimulation();
                updateStats();
                resetChart();
            }

            function resetChart() {
                if (chart) {
                    chart.data.labels = [];
                    chart.data.datasets.forEach(
                        (dataset) => (dataset.data = []),
                    );
                    chart.update();
                }
            }

            startBtn.addEventListener("click", () => {
                isRunning = !isRunning;
                startBtn.textContent = isRunning ? "Pause" : "Resume";
                if (isRunning) runSimulation();
            });

            resetBtn.addEventListener("click", resetSimulation);
            resetSimulation();
        </script>
    </body>
</html>
